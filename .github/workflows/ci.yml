name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: typecheck, test, pairing check, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run check:pairing
      - run: pnpm build
      - name: Built page keeps the strict CSP (no unsafe-eval, no unsafe-inline)
        run: |
          grep -q "script-src 'self'" dist/index.html
          ! grep -q "unsafe-eval" dist/index.html
          ! grep -q "unsafe-inline" dist/index.html
